<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Frame action fixture</title>
<style>
  body { margin: 0; }
  button { display: block; width: 100%; height: 80px; }
  #scroller { height: 150px; overflow: auto; }
  #content { height: 2000px; background: linear-gradient(white, #222); }
</style>
<button id="next">次のページ</button>
<div id="scroller"><div id="content">スクロールする本文</div></div>
<script>
  window.clicks = 0;
  document.querySelector('#next').addEventListener('click', () => { window.clicks++; });
</script>
</html>
