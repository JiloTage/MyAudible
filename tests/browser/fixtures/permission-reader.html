<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>MyAudible画面取得テスト</title>
<style>
  body { margin: 0; padding: 80px; background: white; color: black; font: 30px Meiryo, sans-serif; }
  p { margin: 25px 0; }
</style>
<p>これは画面の読み取りテストです。</p>
<p>表示した日本語から音声を作ります。</p>
<p>Chrome拡張機能の開発に必要な知識をまとめました。画面に表示された日本語を読み取り、ローカルのサーバーで音声を生成します。生成した音声はブラウザへ順番に送信し、再生の応答を確認します。</p>
<p>長い文章でも途中で接続が切れないことを確認します。音声の生成は再生よりも速いため、ブラウザには再生を待っている音声がたまります。画面の読み取り結果を最後まで読み上げます。</p>
</html>
