[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "myaudible"
version = "0.1.0"
description = "Local OCR and streaming speech bridge for the MyAudible Chrome sidebar"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "websockets>=13,<17",
  "python-multipart>=0.0.20,<1", "Pillow>=11,<13", "numpy>=1.26,<3",
]

[project.optional-dependencies]
ocr = ["yomitoku==0.15.0"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
myaudible = "myaudible.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["myaudible*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
